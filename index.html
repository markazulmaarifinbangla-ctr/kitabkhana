<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মারকাযুল মাআরিফ - কিতাবখানা</title>
    <style>
        :root {
            --primary-color: #008080;
            --accent-color: #d4af37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e0e0e0;
            --border-color: #0f3460;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'SolaimanLipi';
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-header {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .admin-btn { background-color: var(--accent-color); color: #000; }
        .edit-header-btn { background-color: #e67e22; color: white; }
        .theme-toggle-btn { background-color: #34495e; color: white; }

        /* Controls / Search Area */
        .controls-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
        }

        .search-box, .filter-select {
            padding: 10px;
            border: 2px solid var(--primary-color);
            border-radius: 5px;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .search-box { flex: 2 1 220px; }
        .filter-select { flex: 1 1 130px; cursor: pointer; }

        /* Loading & Messages */
        #loadingText {
            text-align: center;
            font-size: 1.1rem;
            margin: 30px 0;
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Book Grid */
        .book-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .book-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        /* Embedded Archive Live Viewer Container */
        .cover-container {
            width: 100%;
            height: 260px;
            background-color: #000;
            position: relative;
        }

        .cover-embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bookmark Icon */
        .bookmark-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
        }

        .bookmark-btn.active { color: #f1c40f; }

        /* Metadata Section */
        .book-info {
            padding: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 4px 0;
            line-height: 1.3;
        }

        .book-author { font-size: 0.85rem; opacity: 0.8; }
        .author-death { font-size: 0.8rem; color: #e67e22; margin-bottom: 8px; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 5px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 6px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-drive { background-color: #27ae60; }
        .btn-archive { background-color: #2980b9; }
        .btn-telegram { background-color: #0088cc; }
        .btn-share { background-color: #8e44ad; }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin: 30px 0;
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid var(--primary-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .page-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-color);
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .form-actions { display: flex; gap: 10px; margin-top: 15px; }
        .submit-btn { background-color: var(--primary-color); color: white; border: none; padding: 10px; flex: 2; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .delete-btn-modal { background-color: #c0392b; color: white; border: none; padding: 10px; flex: 1.5; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background-color: #7f8c8d; color: white; border: none; padding: 10px; flex: 1; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>মারকাযুল মাআরিফ - কিতাবখানা</h1>
        <div class="header-buttons">
            <button class="btn-header theme-toggle-btn" onclick="toggleDarkMode()">🌙 ডার্ক মোড</button>
            <button class="btn-header admin-btn" onclick="openAdminModal()">+ কিতাব যুক্ত করুন</button>
            <button class="btn-header edit-header-btn" onclick="openSelectEditModal()">✏ তথ্য এডিট</button>
            <button class="btn-header" style="background:#16a085; color:white;" onclick="exportData()">💾 ডাটা ব্যাকআপ</button>
        </div>
    </header>

    <!-- Filter & Search Controls -->
    <div class="controls-container">
        <input type="text" id="searchInput" class="search-box" placeholder="কিতাব বা লেখকের নাম খুঁজুন..." onkeyup="filterBooks()">
        
        <select id="authorFilter" class="filter-select" onchange="filterBooks()">
            <option value="">সকল লেখক</option>
        </select>

        <select id="yearFilter" class="filter-select" onchange="filterBooks()">
            <option value="">সকল সাল / যুগ</option>
        </select>

        <select id="tagFilter" class="filter-select" onchange="filterBooks()">
            <option value="">সকল বিষয় (ট্যাগ)</option>
        </select>

        <select id="bookmarkFilter" class="filter-select" onchange="filterBooks()">
            <option value="all">সকল কিতাব</option>
            <option value="saved">পছন্দের কিতাবসমূহ (Saved)</option>
        </select>
    </div>

    <!-- Loading Text -->
    <div id="loadingText">গুগল শিট থেকে কিতাব লোড হচ্ছে...</div>

    <!-- Books Grid -->
    <div class="book-grid" id="bookGrid"></div>

    <!-- Pagination Container -->
    <div class="pagination-container" id="pagination"></div>

    <!-- Select Book To Edit Modal -->
    <div id="selectEditModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>এডিট করার জন্য কিতাব নির্বাচন করুন</h3>
                <button class="close-btn" onclick="closeSelectEditModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>কিতাব সিলেক্ট করুন:</label>
                <select id="bookToEditSelect">
                    <option value="">-- একটি কিতাব বাছুন --</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="submit-btn" onclick="loadSelectedBookForEdit()">এডিট ফর্ম খুলুন</button>
                <button type="button" class="cancel-btn" onclick="closeSelectEditModal()">বাতিল</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Book Form Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">কিতাবের তথ্য ফর্ম</h3>
                <button class="close-btn" onclick="closeAdminModal()">&times;</button>
            </div>
            <form id="addBookForm" onsubmit="saveBook(event)">
                <input type="hidden" id="editBookId">
                
                <div class="form-group">
                    <label>অ্যাডমিন পাসওয়ার্ড:</label>
                    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন" required>
                </div>
                <div class="form-group">
                    <label>কিতাবের নাম:</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label>লেখকের নাম:</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label>মৃত্যু সাল / সন:</label>
                    <input type="text" id="authorDeath" placeholder="যেমন: ৯১১ হিজরি" required>
                </div>
                <div class="form-group">
                    <label>কভার ছবির লিংক (Image URL):</label>
                    <input type="url" id="coverUrl" placeholder="https://archive.org/services/img/..." required>
                </div>
                <div class="form-group">
                    <label>বিষয় / ট্যাগ (কমা দিয়ে আলাদা করুন):</label>
                    <input type="text" id="bookTags" placeholder="ফিকহ, উসুল, হাদিস">
                </div>
                <div class="form-group">
                    <label>আর্কাইভ প্রিভিউ লিংক (Embed URL):</label>
                    <input type="url" id="archiveEmbedUrl" placeholder="https://archive.org/embed/..." required>
                </div>
                <div class="form-group">
                    <label>গুগল ড্রাইভ লিংক:</label>
                    <input type="url" id="driveUrl" placeholder="https://drive.google.com/...">
                </div>
                <div class="form-group">
                    <label>আর্কাইভ ডাউনলোড লিংক:</label>
                    <input type="url" id="archiveUrl" placeholder="https://archive.org/details/...">
                </div>
                <div class="form-group">
                    <label>টেলিগ্রাম লিংক:</label>
                    <input type="url" id="telegramUrl" placeholder="https://t.me/...">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">সংরক্ষণ করুন</button>
                    <button type="button" id="deleteCurrentBookBtn" class="delete-btn-modal" style="display:none;" onclick="deleteBookFromEditForm()">ডিলিট করুন</button>
                    <button type="button" class="cancel-btn" onclick="closeAdminModal()">বাতিল</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "123";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyF2y_46ic_GhJo1fpu7qMJ-WtTO2_t2wgJuvR5W_Oqca_gGjDuhKy25mXG7Xvvzn/exec";
        
        const ITEMS_PER_PAGE = 12;
        let currentPage = 1;
        let books = [];
        let bookmarks = JSON.parse(localStorage.getItem('markaz_bookmarks')) || [];

        window.onload = function() {
            fetchBooks();
        };

        // Fetch Books from Google Sheets
        function fetchBooks() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    books = data;
                    document.getElementById('loadingText').style.display = 'none';
                    renderBooks(books);
                    populateFilters();
                })
                .catch(error => {
                    console.error('Error fetching books:', error);
                    document.getElementById('loadingText').innerText = 'ডেটা লোড করতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।';
                });
        }

        function renderBooks(data) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const paginatedData = data.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            if (paginatedData.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">কোনো কিতাব পাওয়া যায়নি।</p>';
                renderPagination(0);
                return;
            }

            paginatedData.forEach(book => {
                const isSaved = bookmarks.includes(String(book.id));
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <button class="bookmark-btn ${isSaved ? 'active' : ''}" onclick="toggleBookmark('${book.id}')">★</button>
                    <div class="cover-container">
                        <iframe src="${book.archiveEmbed}" class="cover-embed"></iframe>
                    </div>
                    <div class="book-info">
                        <div>
                            <h3 class="book-title">${book.title}</h3>
                            <div class="book-author">লেখক: ${book.author}</div>
                            <div class="author-death">মৃত্যু: ${book.death || 'অজানা'}</div>
                        </div>
                        <div class="btn-group">
                            ${book.drive ? `<a href="${book.drive}" target="_blank" class="btn btn-drive">📖 Google Drive</a>` : ''}
                            ${book.archive ? `<a href="${book.archive}" target="_blank" class="btn btn-archive">🏛 Archive Download</a>` : ''}
                            ${book.telegram ? `<a href="${book.telegram}" target="_blank" class="btn btn-telegram">✈ Telegram</a>` : ''}
                            <button class="btn btn-share" onclick="shareBook('${book.title}', '${book.drive || book.archive}')">🔗 শেয়ার করুন</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination(data.length);
        }

        function renderPagination(totalItems) {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            const pageCount = Math.ceil(totalItems / ITEMS_PER_PAGE);

            if (pageCount <= 1) return;

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; filterBooks(); window.scrollTo({top: 0, behavior: 'smooth'}); };
                container.appendChild(btn);
            }
        }

        function toggleBookmark(id) {
            if (bookmarks.includes(String(id))) {
                bookmarks = bookmarks.filter(bId => bId !== String(id));
            } else {
                bookmarks.push(String(id));
            }
            localStorage.setItem('markaz_bookmarks', JSON.stringify(bookmarks));
            filterBooks();
        }

        function shareBook(title, url) {
            if (navigator.share) {
                navigator.share({ title: title, url: url });
            } else {
                navigator.clipboard.writeText(url);
                alert('লিংক কপি করা হয়েছে! বন্ধুদের শেয়ার করুন।');
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(books, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "markaz_books.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function populateFilters() {
            const authors = [...new Set(books.map(b => b.author))];
            const years = [...new Set(books.map(b => b.death).filter(Boolean))];
            const tags = [...new Set(books.flatMap(b => Array.isArray(b.tags) ? b.tags : (b.tags ? String(b.tags).split(',') : []).map(t => t.trim())))];

            const authorSelect = document.getElementById('authorFilter');
            const yearSelect = document.getElementById('yearFilter');
            const tagSelect = document.getElementById('tagFilter');

            authorSelect.innerHTML = '<option value="">সকল লেখক</option>';
            yearSelect.innerHTML = '<option value="">সকল সাল / যুগ</option>';
            tagSelect.innerHTML = '<option value="">সকল বিষয় (ট্যাগ)</option>';

            authors.forEach(a => authorSelect.innerHTML += `<option value="${a}">${a}</option>`);
            years.forEach(y => yearSelect.innerHTML += `<option value="${y}">${y}</option>`);
            tags.forEach(t => { if(t) tagSelect.innerHTML += `<option value="${t}">${t}</option>` });
        }

        function filterBooks() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const selectedAuthor = document.getElementById('authorFilter').value;
            const selectedYear = document.getElementById('yearFilter').value;
            const selectedTag = document.getElementById('tagFilter').value;
            const bookmarkFilter = document.getElementById('bookmarkFilter').value;

            const filtered = books.filter(book => {
                const matchesSearch = book.title.toLowerCase().includes(searchText) || book.author.toLowerCase().includes(searchText);
                const matchesAuthor = selectedAuthor === "" || book.author === selectedAuthor;
                const matchesYear = selectedYear === "" || book.death === selectedYear;
                
                const bookTags = Array.isArray(book.tags) ? book.tags : (book.tags ? String(book.tags).split(',').map(t => t.trim()) : []);
                const matchesTag = selectedTag === "" || bookTags.includes(selectedTag);
                
                const matchesBookmark = bookmarkFilter === 'all' || bookmarks.includes(String(book.id));

                return matchesSearch && matchesAuthor && matchesYear && matchesTag && matchesBookmark;
            });

            currentPage = 1;
            renderBooks(filtered);
        }

        function openAdminModal() {
            document.getElementById('modalTitle').innerText = "নতুন কিতাব যুক্ত করুন";
            document.getElementById('editBookId').value = "";
            document.getElementById('addBookForm').reset();
            document.getElementById('deleteCurrentBookBtn').style.display = 'none';
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
        
        function openSelectEditModal() {
            const select = document.getElementById('bookToEditSelect');
            select.innerHTML = '<option value="">-- একটি কিতাব বাছুন --</option>';
            books.forEach(b => select.innerHTML += `<option value="${b.id}">${b.title} (${b.author})</option>`);
            document.getElementById('selectEditModal').style.display = 'flex';
        }
        
        function closeSelectEditModal() { document.getElementById('selectEditModal').style.display = 'none'; }

        function loadSelectedBookForEdit() {
            const bookId = document.getElementById('bookToEditSelect').value;
            if (!bookId) return alert('একটি কিতাব সিলেক্ট করুন!');
            const book = books.find(b => String(b.id) === String(bookId));
            if (!book) return;

            closeSelectEditModal();
            document.getElementById('modalTitle').innerText = "কিতাবের তথ্য এডিট করুন (গুগল শিট)";
            document.getElementById('editBookId').value = book.id;
            document.getElementById('bookTitle').value = book.title;
            document.getElementById('bookAuthor').value = book.author;
            document.getElementById('authorDeath').value = book.death;
            document.getElementById('coverUrl').value = book.cover || '';
            document.getElementById('bookTags').value = Array.isArray(book.tags) ? book.tags.join(', ') : (book.tags || '');
            document.getElementById('archiveEmbedUrl').value = book.archiveEmbed;
            document.getElementById('driveUrl').value = book.drive || '';
            document.getElementById('archiveUrl').value = book.archive || '';
            document.getElementById('telegramUrl').value = book.telegram || '';
            document.getElementById('deleteCurrentBookBtn').style.display = 'block';
            document.getElementById('adminModal').style.display = 'flex';
        }

        function deleteBookFromEditForm() {
            if (document.getElementById('adminPassword').value !== ADMIN_PASSWORD) return alert('ভুল পাসওয়ার্ড!');
            alert('সরাসরি গুগল শিট থেকে কিতাব ডিলিট করতে চাইলে সরাসরি আপনার গুগল শিটে গিয়ে সেই রো (Row) টি মুছে ফেলুন।');
            closeAdminModal();
        }

        function saveBook(e) {
            e.preventDefault();
            if (document.getElementById('adminPassword').value !== ADMIN_PASSWORD) return alert('ভুল পাসওয়ার্ড!');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "সংরক্ষণ হচ্ছে...";
            submitBtn.disabled = true;

            const editId = document.getElementById('editBookId').value;
            const bookData = {
                id: editId ? editId : Date.now(),
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                death: document.getElementById('authorDeath').value,
                cover: document.getElementById('coverUrl').value,
                tags: document.getElementById('bookTags').value,
                archiveEmbed: document.getElementById('archiveEmbedUrl').value,
                drive: document.getElementById('driveUrl').value,
                archive: document.getElementById('archiveUrl').value,
                telegram: document.getElementById('telegramUrl').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            })
            .then(() => {
                alert('আলহামদুলিল্লাহ! সফলভাবে গুগল শিটে সংরক্ষিত হয়েছে।');
                closeAdminModal();
                submitBtn.innerText = "সংরক্ষণ করুন";
                submitBtn.disabled = false;
                setTimeout(() => { fetchBooks(); }, 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('সংরক্ষণ করতে সমস্যা হয়েছে!');
                submitBtn.innerText = "সংরক্ষণ করুন";
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
