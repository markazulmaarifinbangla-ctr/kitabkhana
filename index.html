<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মারকাযুল মাআরিফ - কিতাবখানা</title>
    <style>
        :root {
            --primary-color: #008080;
            --accent-color: #d4af37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e0e0e0;
            --border-color: #0f3460;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'SolaimanLipi';
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-header {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .admin-btn { background-color: var(--accent-color); color: #000; }
        .edit-header-btn { background-color: #e67e22; color: white; }
        .theme-toggle-btn { background-color: #34495e; color: white; }

        /* Controls / Search Area */
        .controls-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
        }

        .search-box, .filter-select {
            padding: 10px;
            border: 2px solid var(--primary-color);
            border-radius: 5px;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .search-box { flex: 2 1 220px; }
        .filter-select { flex: 1 1 130px; cursor: pointer; }

        /* Loading & Messages */
        #loadingText {
            text-align: center;
            font-size: 1.1rem;
            margin: 30px 0;
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Book Grid */
        .book-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .book-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        /* Embedded Archive Live Viewer Container */
        .cover-container {
            width: 100%;
            height: 260px;
            background-color: #000;
            position: relative;
        }

        .cover-embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bookmark Icon */
        .bookmark-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
        }

        .bookmark-btn.active { color: #f1c40f; }

        /* Metadata Section */
        .book-info {
            padding: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 4px 0;
            line-height: 1.3;
        }

        .book-author { font-size: 0.85rem; opacity: 0.8; }
        .author-death { font-size: 0.8rem; color: #e67e22; margin-bottom: 8px; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 5px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 6px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-drive { background-color: #27ae60; }
        .btn-archive { background-color: #2980b9; }
        .btn-telegram { background-color: #0088cc; }
        .btn-share { background-color: #8e44ad; }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin: 30px 0;
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid var(--primary-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .page-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-color);
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .form-actions { display: flex; gap: 10px; margin-top: 15px; }
        .submit-btn { background-color: var(--primary-color); color: white; border: none; padding: 10px; flex: 2; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .delete-btn-modal { background-color: #c0392b; color: white; border: none; padding: 10px; flex: 1.5; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background-color: #7f8c8d; color: white; border: none; padding: 10px; flex: 1; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>মারকাযুল মাআরিফ - কিতাবখানা</h1>
        <div class="header-buttons">
            <button class="btn-header theme-toggle-btn" onclick="toggleDarkMode()">🌙 ডার্ক মোড</button>
            <button class="btn-header admin-btn" onclick="openAdminModal()">+ কিতাব যুক্ত করুন</button>
            <button class="btn-header edit-header-btn" onclick="openSelectEditModal()">✏ তথ্য এডিট</button>
            <button class="btn-header" style="background:#16a085; color:white;" onclick="exportData()">💾 ডাটা ব্যাকআপ</button>
        </div>
    </header>

    <!-- Filter & Search Controls -->
    <div class="controls-container">
        <input type="text" id="searchInput" class="search-box" placeholder="কিতাব বা লেখকের নাম খুঁজুন..." onkeyup="filterBooks()">
        
        <select id="authorFilter" class="filter-select" onchange="filterBooks()">
            <option value="">সকল লেখক</option>
        </select>

        <select id="yearFilter" class="filter-select" onchange="filterBooks()">
            <option value="">সকল সাল / যুগ</option>
        </select>

        <select id="tagFilter" class="filter-select" onchange="filterBooks()">
            <option value="">সকল বিষয় (ট্যাগ)</option>
        </select>

        <select id="bookmarkFilter" class="filter-select" onchange="filterBooks()">
            <option value="all">সকল কিতাব</option>
            <option value="saved">পছন্দের কিতাবসমূহ (Saved)</option>
        </select>
    </div>

    <!-- Loading Text -->
    <div id="loadingText">গুগল শিট থেকে কিতাব লোড হচ্ছে...</div>

    <!-- Books Grid -->
    <div class="book-grid" id="bookGrid"></div>

    <!-- Pagination Container -->
    <div class="pagination-container" id="pagination"></div>

    <!-- Select Book To Edit Modal -->
    <div id="selectEditModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>এডিট করার জন্য কিতাব নির্বাচন করুন</h3>
                <button class="close-btn" onclick="closeSelectEditModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>কিতাব সিলেক্ট করুন:</label>
                <select id="bookToEditSelect">
                    <option value="">-- একটি কিতাব বাছুন --</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="submit-btn" onclick="loadSelectedBookForEdit()">এডিট ফর্ম খুলুন</button>
                <button type="button" class="cancel-btn" onclick="closeSelectEditModal()">বাতিল</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Book Form Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">কিতাবের তথ্য ফর্ম</h3>
                <button class="close-btn" onclick="closeAdminModal()">&times;</button>
            </div>
            <form id="addBookForm" onsubmit="saveBook(event)">
                <input type="hidden" id="editBookId">
                
                <div class="form-group">
                    <label>অ্যাডমিন পাসওয়ার্ড:</label>
                    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন" required>
                </div>
                <div class="form-group">
                    <label>কিতাবের নাম:</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label>লেখকের নাম:</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label>মৃত্যু সাল / সন:</label>
                    <input type="text" id="authorDeath" placeholder="যেমন: ৯১১ হিজরি" required>
                </div>
                <div class="form-group">
                    <label>কভার ছবির লিংক (Image URL):</label>
                    <input type="url" id="coverUrl" placeholder="https://archive.org/services/img/..." required>
                </div>
                <div class="form-group">
                    <label>বিষয় / ট্যাগ (কমা দিয়ে আলাদা করুন):</label>
                    <input type="text" id="bookTags" placeholder="ফিকহ, উসুল, হাদিস">
                </div>
                <div class="form-group">
                    <label>আর্কাইভ প্রিভিউ লিংক (Embed URL):</label>
                    <input type="url" id="archiveEmbedUrl" placeholder="https://archive.org/embed/..." required>
                </div>
                <div class="form-group">
                    <label>গুগল ড্রাইভ লিংক:</label>
                    <input type="url" id="driveUrl" placeholder="https://drive.google.com/...">
                </div>
                <div class="form-group">
                    <label>আর্কাইভ ডাউনলোড লিংক:</label>
                    <input type="url" id="archiveUrl" placeholder="https://archive.org/details/...">
                </div>
                <div class="form-group">
                    <label>টেলিগ্রাম লিংক:</label>
                    <input type="url" id="telegramUrl" placeholder="https://t.me/...">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">সংরক্ষণ করুন</button>
                    <button type="button" id="deleteCurrentBookBtn" class="delete-btn-modal" style="display:none;" onclick="deleteBookFromEditForm()">ডিলিট করুন</button>
                    <button type="button" class="cancel-btn" onclick="closeAdminModal()">বাতিল</button>
                </div>
            </form>
        </div>
    </div>

    <script>
/* নতুন Google Apps Script Web App URL এখানে বসাবেন। পুরোনো URL বর্তমানে 404 দিচ্ছে। */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby4Y-tcmJotmQEL-CpLd6RdlZNZ3XCa_m9nY7jeaGKzQNzKxDjADDRoy5PuHNj03k8O/exec';
const ADMIN_PASSWORD='123';const ITEMS_PER_PAGE=12;let currentPage=1,books=[],filteredBooks=[],bookmarks=JSON.parse(localStorage.getItem('markaz_bookmarks')||'[]');
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normalize=b=>({id:String(b.id??b.ID??Date.now()+Math.random()),title:String(b.title??b.name??''),author:String(b.author??''),death:String(b.death??b.authorDeath??''),cover:String(b.cover??''),tags:Array.isArray(b.tags)?b.tags:String(b.tags??'').split(',').map(x=>x.trim()).filter(Boolean),archiveEmbed:String(b.archiveEmbed??b.archive_embed??b.preview??''),drive:String(b.drive??''),archive:String(b.archive??''),telegram:String(b.telegram??'')});
function showStatus(t,error=false){let el=$('statusText');if(!el){el=document.createElement('div');el.id='statusText';el.style.cssText='text-align:center;margin:10px 15px;color:#16805b;font-size:.9rem';$('loadingText').after(el)}el.textContent=t;el.style.color=error?'#c0392b':'#16805b'}
async function fetchBooks(){ $('loadingText').style.display='block';showStatus(''); if(!SCRIPT_URL.startsWith('http')){books=JSON.parse(localStorage.getItem('markaz_local_books')||'[]').map(normalize);$('loadingText').style.display='none';showStatus('Google Apps Script URL বসানো হয়নি; স্থানীয় ডাটা দেখানো হচ্ছে।',true);afterLoad();return} try{let r=await fetch(SCRIPT_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let text=await r.text(),data=JSON.parse(text);let arr=Array.isArray(data)?data:(data.books||data.data||data.items||[]);if(!Array.isArray(arr))throw new Error('অচেনা JSON format');books=arr.map(normalize);localStorage.setItem('markaz_local_books',JSON.stringify(books));$('loadingText').style.display='none';showStatus(`${books.length}টি কিতাব লোড হয়েছে।`);afterLoad()}catch(e){console.error(e);$('loadingText').style.display='none';books=JSON.parse(localStorage.getItem('markaz_local_books')||'[]').map(normalize);showStatus('Google Sheet লোড হয়নি। Apps Script Web App URL/Deploy পরীক্ষা করুন।',true);afterLoad()}}
function afterLoad(){populateFilters();filterBooks()}
function populateFilters(){let a=[...new Set(books.map(b=>b.author).filter(Boolean))].sort(),y=[...new Set(books.map(b=>b.death).filter(Boolean))].sort(),t=[...new Set(books.flatMap(b=>b.tags))].sort();$('authorFilter').innerHTML='<option value="">সকল লেখক</option>'+a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('yearFilter').innerHTML='<option value="">সকল সাল / যুগ</option>'+y.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('tagFilter').innerHTML='<option value="">সকল বিষয় (ট্যাগ)</option>'+t.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function filterBooks(){let q=$('searchInput').value.trim().toLowerCase(),a=$('authorFilter').value,y=$('yearFilter').value,t=$('tagFilter').value,s=$('bookmarkFilter').value;filteredBooks=books.filter(b=>(!q||[b.title,b.author,b.death,...b.tags].join(' ').toLowerCase().includes(q))&&(!a||b.author===a)&&(!y||b.death===y)&&(!t||b.tags.includes(t))&&(s!=='saved'||bookmarks.includes(String(b.id))));currentPage=Math.min(currentPage,Math.max(1,Math.ceil(filteredBooks.length/ITEMS_PER_PAGE)));renderBooks()}
function renderBooks(){let grid=$('bookGrid');let start=(currentPage-1)*ITEMS_PER_PAGE,arr=filteredBooks.slice(start,start+ITEMS_PER_PAGE);grid.innerHTML=arr.length?arr.map(b=>{let saved=bookmarks.includes(String(b.id));let cover=b.cover?`<img class="cover-image" src="${esc(b.cover)}" alt="${esc(b.title)}" onerror="this.outerHTML='<iframe class=cover-embed src=\"${esc(b.archiveEmbed)}\"></iframe>'">`:`<iframe class="cover-embed" src="${esc(b.archiveEmbed)}" loading="lazy"></iframe>`;return `<article class="book-card"><button class="bookmark-btn ${saved?'active':''}" onclick="toggleBookmark('${esc(b.id)}')">★</button><div class="cover-container">${cover}</div><div class="book-info"><div><h3 class="book-title">${esc(b.title)}</h3><div class="book-author">লেখক: ${esc(b.author)}</div><div class="author-death">মৃত্যু: ${esc(b.death||'অজানা')}</div><div class="book-tags">${b.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="btn-group">${b.drive?`<a href="${esc(b.drive)}" target="_blank" class="btn btn-drive">📖 Google Drive</a>`:''}${b.archive?`<a href="${esc(b.archive)}" target="_blank" class="btn btn-archive">🏛 Archive Download</a>`:''}${b.telegram?`<a href="${esc(b.telegram)}" target="_blank" class="btn btn-telegram">✈ Telegram</a>`:''}<button class="btn btn-share" onclick="shareBook(${JSON.stringify(b.title)},${JSON.stringify(b.drive||b.archive||b.archiveEmbed)})">🔗 শেয়ার করুন</button></div></div></article>`}).join(''):'<p class="empty">কোনো কিতাব পাওয়া যায়নি।</p>';renderPagination()}
function renderPagination(){let p=Math.ceil(filteredBooks.length/ITEMS_PER_PAGE),c=$('pagination');c.innerHTML='';for(let i=1;i<=p;i++){let b=document.createElement('button');b.className='page-btn '+(i===currentPage?'active':'');b.textContent=i;b.onclick=()=>{currentPage=i;renderBooks();scrollTo({top:0,behavior:'smooth'})};c.appendChild(b)}}
function toggleBookmark(id){id=String(id);bookmarks=bookmarks.includes(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];localStorage.setItem('markaz_bookmarks',JSON.stringify(bookmarks));filterBooks()}function shareBook(title,url){if(!url)return alert('এই কিতাবের লিংক নেই');if(navigator.share)navigator.share({title,url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>alert('লিংক কপি করা হয়েছে!'))}function toggleDarkMode(){document.body.classList.toggle('dark-mode');localStorage.setItem('markaz_dark',document.body.classList.contains('dark-mode')?'1':'0')}function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(books,null,2));a.download='markaz_books.json';a.click()}
function openAdminModal(){ $('modalTitle').textContent='নতুন কিতাব যুক্ত করুন';$('editBookId').value='';$('addBookForm').reset();$('deleteCurrentBookBtn').style.display='none';$('adminModal').style.display='flex'}function closeAdminModal(){$('adminModal').style.display='none'}function openSelectEditModal(){let s=$('bookToEditSelect');s.innerHTML='<option value="">-- একটি কিতাব বাছুন --</option>'+books.map(b=>`<option value="${esc(b.id)}">${esc(b.title)} (${esc(b.author)})</option>`).join('');$('selectEditModal').style.display='flex'}function closeSelectEditModal(){$('selectEditModal').style.display='none'}function loadSelectedBookForEdit(){let b=books.find(x=>x.id===$('bookToEditSelect').value);if(!b)return alert('একটি কিতাব সিলেক্ট করুন!');closeSelectEditModal();$('modalTitle').textContent='কিতাবের তথ্য এডিট করুন';$('editBookId').value=b.id;$('bookTitle').value=b.title;$('bookAuthor').value=b.author;$('authorDeath').value=b.death;$('coverUrl').value=b.cover;$('bookTags').value=b.tags.join(', ');$('archiveEmbedUrl').value=b.archiveEmbed;$('driveUrl').value=b.drive;$('archiveUrl').value=b.archive;$('telegramUrl').value=b.telegram;$('deleteCurrentBookBtn').style.display='block';$('adminModal').style.display='flex'}
async function apiWrite(action,payload){if(!SCRIPT_URL.startsWith('http')){let local=books.findIndex(b=>b.id===payload.id);if(action==='delete'&&local>=0)books.splice(local,1);else if(local>=0)books[local]=normalize(payload);else books.unshift(normalize(payload));localStorage.setItem('markaz_local_books',JSON.stringify(books));return true}let r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});let text=await r.text();let out=JSON.parse(text);if(!out.ok)throw new Error(out.error||'ব্যর্থ');return true}
async function saveBook(e){e.preventDefault();if($('adminPassword').value!==ADMIN_PASSWORD)return alert('ভুল পাসওয়ার্ড!');let data={id:$('editBookId').value||Date.now(),title:$('bookTitle').value.trim(),author:$('bookAuthor').value.trim(),death:$('authorDeath').value.trim(),cover:$('coverUrl').value.trim(),tags:$('bookTags').value.split(',').map(x=>x.trim()).filter(Boolean),archiveEmbed:$('archiveEmbedUrl').value.trim(),drive:$('driveUrl').value.trim(),archive:$('archiveUrl').value.trim(),telegram:$('telegramUrl').value.trim()};$('submitBtn').disabled=true;try{await apiWrite(data.id&&$('editBookId').value?'update':'add',{...data,password:$('adminPassword').value});books=books.filter(b=>String(b.id)!==String(data.id));if(data.id)books.unshift(normalize(data));localStorage.setItem('markaz_local_books',JSON.stringify(books));closeAdminModal();afterLoad();alert('আলহামদুলিল্লাহ! সফলভাবে সংরক্ষিত হয়েছে।')}catch(e){alert('সংরক্ষণ হয়নি: '+e.message)}finally{$('submitBtn').disabled=false}}
async function deleteBookFromEditForm(){if($('adminPassword').value!==ADMIN_PASSWORD)return alert('ভুল পাসওয়ার্ড!');let id=$('editBookId').value;if(!confirm('এই কিতাবটি ডিলিট করবেন?'))return;try{await apiWrite('delete',{id,password:$('adminPassword').value});books=books.filter(b=>String(b.id)!==String(id));localStorage.setItem('markaz_local_books',JSON.stringify(books));closeAdminModal();afterLoad();alert('কিতাব ডিলিট হয়েছে')}catch(e){alert('ডিলিট হয়নি: '+e.message)}}
if(localStorage.getItem('markaz_dark')==='1')document.body.classList.add('dark-mode');fetchBooks();
</script>
